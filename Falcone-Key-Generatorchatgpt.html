function importBackup(){ownerGuard();const i=el('input',{type:'file',accept:'.json,application/json','aria-label':'Backup JSON file'});i.onchange=attempt(async()=>{ownerGuard();const file=i.files[0];if(!file)return;if(file.size>150*1024*1024)throw Error('Backup is too large (maximum 150 MB).');const b=JSON.parse(await file.text());await validateBackup(b);if(!confirm(`Replace this browser’s apps, company settings and ${data.records.length} records with ${b.records.length} imported records? Export a backup first. Staff profiles remain unchanged.`))return;ownerGuard();await replaceData(b);await refresh();appFilter='';document.querySelector('#dialog').close();render();toast('Backup restored, including attachments.');});modal('Restore a backup',el('div',{},el('p',{},'Restore replaces existing apps, company settings and activation/customer records. Duplicate keys in the backup are rejected. Existing keys are replaced by the validated snapshot, not appended.'),i));}
async function validateBackup(b){const assert=(ok,msg)=>{if(!ok)throw Error('Invalid backup: '+msg);};assert(b.schema==='falcone-backup-v1'&&b.attachmentsIncluded===true,'unsupported schema or missing attachments declaration.');for(const n of ['apps','settings','records'])assert(Array.isArray(b[n]),'missing '+n);const text=v=>typeof v==='string';const uniq=(list,k)=>new Set(list.map(x=>x[k])).size===list.length;for(const n of ['apps','settings','records'])assert(b[n].every(x=>x&&text(x.id))&&uniq(b[n],'id'),'duplicate or missing IDs.');assert(uniq(b.records,'key'),'duplicate activation keys.');const attachment=async f=>{if(!f)return;assert(text(f.name)&&text(f.data)&&/^data:(image\/png|image\/jpeg|application\/pdf);base64,/.test(f.data),'invalid attachment.');const raw=atob(f.data.split(',')[1]);assert(raw.length===f.size&&raw.length<=10485760,'attachment size.');await fileData(new File([Uint8Array.from(raw,c=>c.charCodeAt(0))],f.name,{type:f.type}));};for(const a of b.apps){assert(/^[A-Za-z0-9]{2,16}$/.test(a.id)&&text(a.name)&&a.name.trim()&&text(a.version)&&validURL(a.url)&&Number.isInteger(a.days)&&a.days>0&&a.days<=3650&&typeof a.active==='boolean','application fields.');await attachment(a.logo);assert(!a.logo||a.logo.type.startsWith('image/'),'logo must be an image.');}assert(b.settings.length===1&&b.settings[0].id==='company','company settings.');const c=b.settings[0];assert(text(c.name)&&c.name.trim()&&validPhone(c.phone)&&(!c.website||validURL(c.website)),'company fields.');for(const k of ['address','email','install','activate','policy'])assert(text(c[k]),'company '+k);await attachment(c.logo);assert(!c.logo||c.logo.type.startsWith('image/'),'company logo must be an image.');for(const r of b.records){assert(text(r.key)&&/^FAL-[A-Za-z0-9]+-(DEMO|LIFE)-[A-F0-9-]+$/.test(r.key)&&text(r.customer)&&r.customer.trim()&&validPhone(r.phone)&&['Demo','Lifetime'].includes(r.type)&&text(r.creatorId)&&text(r.creator)&&Number.isFinite(Date.parse(r.created))&&typeof r.revoked==='boolean','activation fields.');assert(b.apps.some(a=>a.id===r.appId)&&r.app?.id===r.appId&&text(r.app.name)&&text(r.app.version)&&validURL(r.app.url),'record app snapshot.');assert(r.type==='Demo'?Number.isFinite(Date.parse(r.expiry)):r.expiry===null,'expiry.');assert(Array.isArray(r.audit)&&r.audit.every(a=>text(a.by)&&text(a.action)&&Number.isFinite(Date.parse(a.at))),'audit.');if(r.type==='Lifetime')assert(!!r.slip,'missing Lifetime slip.');await attachment(r.slip);}}
try{await openDB();await refresh();user=data.users.find(x=>x.id===sessionStorage.getItem('falcone-user')&&x.active);render();}catch(e){root.replaceChildren(el('div',{class:'card'},el('h1',{},'Workspace could not open'),el('p',{},'Enable browser storage and reload. '+e.message)));}
